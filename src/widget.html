<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Meals Widget</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: 13px;
      background: var(--hub-surface, #fff);
      color: var(--hub-text, #111827);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header { display: flex; align-items: center; gap: 6px; padding: 10px 14px 8px; border-bottom: 1px solid #e5e7eb; flex-shrink: 0; }
    .header-icon { font-size: 14px; }
    .header-title { font-size: 12px; font-weight: 600; color: var(--hub-text, #374151); flex: 1; }
    .header-link { font-size: 11px; color: #6366f1; text-decoration: none; }
    .header-link:hover { text-decoration: underline; }

    .content { flex: 1; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }

    .load-error { margin: 8px; padding: 8px 10px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.8rem; }
    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #9ca3af;
      text-align: center;
    }
    .empty .icon { font-size: 1.8rem; }
    .empty p { font-size: 12px; }

    .meal-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .meal-row:last-child { border-bottom: none; }

    .meal-date { font-size: 11px; color: var(--hub-text-muted, #6b7280); width: 48px; flex-shrink: 0; }
    .meal-slot { font-size: 1.1rem; width: 22px; text-align: center; flex-shrink: 0; }
    .meal-name { flex: 1; font-weight: 500; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meal-assignee { font-size: 11px; color: #9ca3af; white-space: nowrap; }
  </style>
</head>
<body>

<div class="header">
  <span class="header-icon" id="header-glyph"></span>
  <span class="header-title">Meals</span>
  <a class="header-link" href="/run/family-meals">Open</a>
</div>

<div class="content" id="content">
  <div class="empty">
    <p>Loading…</p>
  </div>
</div>

<script type="module">
import { esc, glyph, chickadee } from "/hub-sdk.js";

// The header is static markup, so its glyph is filled in from script.
document.getElementById("header-glyph").innerHTML = glyph("cloche");

const DB      = window.__DB_URL      ?? "";
const CONTEXT = window.__CONTEXT_URL ?? "";

const SLOT_GLYPHS = { breakfast: "bowl", lunch: "sandwich", dinner: "pot", snack: "apple" };

async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json().catch(() => null);
  if (!res.ok || !json || typeof json !== "object" || json.error) throw new Error(json?.error || "Couldn’t reach the hub. Try again.");
  return json;
}

function formatDate(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric" });
}

async function init() {
  let members = [];
  if (CONTEXT) {
    const res = await fetch(`${CONTEXT}?keys=family.members`);
    const data = await res.json().catch(() => null);
    // A member list the hub could not read (not OK, not JSON, or named in
    // `$errors`) is a failed load. A key merely absent is "not permitted".
    if (!res.ok || !data || typeof data !== "object" || (Array.isArray(data.$errors) && data.$errors.includes("family.members"))) {
      throw new Error("Couldn’t load the member list.");
    }
    members = data["family.members"] ?? [];
  }
  const memberMap = new Map(members.map(m => [m.id, m]));

  const now = new Date();
  const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;

  const { rows: meals } = await db(`
    SELECT id, plan_date, slot, meal_name, recipe_id, assigned_to, notes, created_at
    FROM app_family_meals__meal_plan
    WHERE plan_date >= ?
    ORDER BY plan_date, CASE slot WHEN 'breakfast' THEN 1 WHEN 'lunch' THEN 2 WHEN 'dinner' THEN 3 ELSE 4 END
    LIMIT 100
  `, [today]);
  if (!meals.length) {
    document.getElementById("content").innerHTML = `
      <div class="empty">
        <span class="icon">${chickadee("nest", { size: 56 })}</span>
        <p>No meals planned</p>
      </div>
    `;
    return;
  }

  const upcoming = meals.slice(0, 4);

  const content = document.getElementById("content");
  content.innerHTML = upcoming.map(m => {
    const assignee = m.assigned_to ? memberMap.get(m.assigned_to)?.name : null;
    return `
      <div class="meal-row">
        <span class="meal-date">${esc(formatDate(m.plan_date))}</span>
        <span class="meal-slot">${glyph(SLOT_GLYPHS[m.slot] || "meal")}</span>
        <span class="meal-name">${esc(m.meal_name)}</span>
        ${assignee ? `<span class="meal-assignee">${esc(assignee)}</span>` : ""}
      </div>
    `;
  }).join("");
}

// A failed read must not leave "Loading…" standing.
init().catch(() => {
  document.getElementById("content").innerHTML = `<div class="load-error" data-testid="load-error" role="alert">Couldn’t load the meal plan.</div>`;
});
</script>
<script type="module">
  // A link to this app opens it through the hub. Followed in place it loaded
  // the whole app inside this tile: the Home grid's sandbox cannot move the
  // hub page. The query goes along as the app's launch params.
  import { hubOpen } from "/hub-sdk.js";
  document.addEventListener("click", (e) => {
    const a = e.target.closest?.('a[href^="/run/"]');
    // Already sent by the hub's own link handler (it runs first, on capture).
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
    const url = new URL(a.href);
    const app = /^\/run\/([a-z0-9_-]+)$/i.exec(url.pathname);
    if (!app) return;
    e.preventDefault();
    hubOpen(app[1], Object.fromEntries(url.searchParams));
  });
</script>
</body>
</html>
